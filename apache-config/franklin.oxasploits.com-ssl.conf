<IfModule mod_ssl.c>
<VirtualHost *:443>
#        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
        ServerAdmin oxagast@oxasploits.com
        DocumentRoot /var/www/franklin
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
	ServerName franklin.oxasploits.com
#	Include /etc/letsencrypt/options-ssl-apache.conf
	ServerAlias franklin
<Directory "/var/www/franklin/">
        Options -Indexes +FollowSymLinks -ExecCGI
        require all granted
        AllowOverride None
</Directory>
<Directory "/">
        Options -Indexes +FollowSymLinks -ExecCGI
        require all denied

</Directory>


<Location "/said/">
        Options +Indexes +FollowSymLinks -ExecCGI
require all granted
</Location>

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/franklin.oxasploits.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/franklin.oxasploits.com/privkey.pem
</VirtualHost>
</IfModule>

